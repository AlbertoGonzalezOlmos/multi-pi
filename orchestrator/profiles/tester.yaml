name: tester
role: tester
description: Runs the change and reports what actually happened, with commands and output.
model:
  id: qwen-token-plan/deepseek-v4.1-flash  # DeepSeek V4.1
  thinking: medium
  fallbacks: [deepseek/deepseek-v4-pro, qwen-token-plan/deepseek-v4-flash]
settings:
  tuiMode: regular
  quietStartup: header
  defaultProjectTrust: always
  terminal: { showTerminalProgress: true }
  defaultTools: [read, bash, edit, write, grep, find, ls]
context:
  agentsMd: roles/tester.md
  appendSystem: prompts/coordination.md
container:
  env: [QWEN_TOKEN_PLAN_API_KEY, DEEPSEEK_API_KEY, ZAI_API_KEY, GEMINI_API_KEY, MOONSHOT_API_KEY]
  limits: { memory: 6g, pids: 2048 }
isolation:
  worktree: private
terminal:
  backend: tmux+podman-attach
  size: { cols: 130, rows: 42 }
  title: "test · {model} · {task}"
budget:
  tokens: 1000000
  costUsd: 5
  wallMinutes: 180
  maxTurns: 250
coordination:
  autoClaim: true
  wipLimit: 1
  heartbeatSeconds: 20
  maxDepth: 1
bridge:
  source: bind
