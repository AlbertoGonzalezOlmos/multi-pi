# Inner tmux — the permanent holder of pi's PTY inside each subharness container.
#
# Why this file exists: a human attaches and detaches at will, and the host tmux server may be
# killed outright. If pi held the PTY directly, the attach client's death would deliver SIGHUP and
# pi would shut down gracefully within ~2s (verified). With tmux holding the PTY, pi never sees
# the client come or go.
#
# The image ships tmux 3.3a (Debian bookworm). `extended-keys` exists in 3.2+; `extended-keys-format`
# requires 3.5+ and is INVALID here — pi's own docs/tmux.md documents exactly this split.

# Distinct from the host tmux's default C-b, so a prefix keystroke reaches one multiplexer and not
# both. C-f is not bound by pi (pi uses C-c, C-d, C-o, C-z, C-j and the arrow/alt chords).
set -g prefix C-f
unbind C-b
bind C-f send-prefix

# pi requests extended-key reporting and falls back to xterm modifyOtherKeys; without this,
# Shift+Enter and Ctrl+Enter arrive as plain Enter and submit prematurely (docs/tmux.md).
set -g extended-keys on

# pi renders its own footer, header and status. A second status line wastes a row and duplicates
# information, so the inner tmux stays invisible.
set -g status off

# pi handles mouse input itself; an inner tmux capturing it would fight the outer one.
set -g mouse off

set -g history-limit 50000
set -g default-terminal "tmux-256color"

# Do not let tmux rename the window after the running command; the orchestrator names it.
set -g allow-rename off
set -g automatic-rename off

# Escape must not linger: pi's editor treats a lone ESC as an interrupt (app.interrupt).
set -sg escape-time 10

# A pane that is closed should kill its window, so the container's PID 1 wait-loop notices pi
# exiting and the container stops rather than idling on an empty session.
set -g destroy-unattached off
